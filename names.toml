# 운동명 표시 매핑 / 부위 태그 / 맨몸 운동 목록.
# 키는 Garmin 코드(대문자 + 밑줄). 리포트에 영어로 나온 이름은 "Face Pull" -> FACE_PULL 로 바꾸면 됩니다.
# 코드를 정확히 알고 싶으면 data/raw/날짜/activity_ID/exercise_sets.json 의 category / name 값을 보세요.

[settings]
# 무게 단위: "auto"(1000 이상이면 g으로 판단) | "g" | "kg"
weight_unit = "auto"

# 무게가 0이어도 정상인 맨몸/시간 운동. 여기에 없는데 무게가 0이면 '무게?'(미입력)로 표시됩니다.
bodyweight = [
  "PULL_UP", "CHIN_UP", "PUSH_UP", "PLANK", "SIT_UP", "CRUNCH",
  "HOLLOW_ROCK", "WIDE_STANCE_PLANK_WITH_LEG_LIFT", "STANDING_T_ROTATION_BALANCE",
  "JUMP_ROPE", "BENCH_DIP", "SINGLE_LEG_DEADLIFT",
]

