:root{
  --ground:#E7EAE7;--sheet:#FAFBF9;--ink:#14191C;--muted:#5A666C;--line:#CBD2CF;--line2:#DCE1DE;
  --accent:#1B6FBF;--on-accent:#FFFFFF;--accent-bg:#DBEAF7;--accent-fg:#0E4A82;
  --chip:#DDE2DF;--field:#F0F2EF;--warn-bg:#FFF1CC;--warn:#795100;--danger:#B42318;--ok:#0E6B45;
  --z1:#98A5AD;--z2:#2D8DD6;--z3:#3DAA68;--z4:#EC9A2A;--z5:#D93F33;
  --num:"Barlow SC","Segoe UI","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --bg:var(--ground);--panel:var(--sheet);--fg:var(--ink);
}
@media (prefers-color-scheme:dark){:root{
  --ground:#0E1214;--sheet:#171C1F;--ink:#E6EBED;--muted:#97A3AA;--line:#2C353A;--line2:#252D31;
  --accent:#5DB0F2;--on-accent:#08202F;--accent-bg:#14303F;--accent-fg:#A3D3F7;
  --chip:#232B2F;--field:#12171A;--warn-bg:#3A3014;--warn:#F0C866;--danger:#F97066;--ok:#7FD6A4;
  --z1:#7F8C94;--z2:#4DA3EA;--z3:#52C07F;--z4:#F2A93E;--z5:#EE6055;
}}
*{box-sizing:border-box}
:root{color-scheme:light dark}
input[type=checkbox]{accent-color:var(--accent)}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.65 "Segoe UI","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.num{font-family:var(--num);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px 10px}
.brand{display:flex;align-items:center;gap:12px}
.brand::before{content:"";width:46px;height:10px;border-radius:2px;background:linear-gradient(90deg,var(--z1) 0 20%,var(--z2) 20% 40%,var(--z3) 40% 60%,var(--z4) 60% 80%,var(--z5) 80% 100%)}
.brand h1{margin:0;font-size:18px;font-weight:700}
.brand .sub{font-size:13px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.small{min-height:36px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:0 24px;border-bottom:1px solid var(--line)}
.tab{min-height:44px;padding:0 14px;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;background:none;font-weight:600;color:var(--muted)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.cols{display:flex;flex-wrap:wrap;gap:20px;padding:20px 24px 32px;align-items:flex-start}
.card{background:none;border:0}
.side{flex:1 1 240px;max-width:280px;min-width:220px;display:flex;flex-direction:column;gap:2px}
.side h2,.claude h2{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--muted)}
.weekh{width:100%;min-height:44px;margin-top:10px;padding:6px 0;border:0;border-top:1px solid var(--line);border-radius:0;background:none;display:flex;align-items:center;gap:8px;text-align:left;font:600 14px var(--num)}
.weekh:hover{color:var(--accent)}
.weekh .wk-s{margin-left:auto;font:400 12px "Segoe UI","Malgun Gothic",sans-serif}
.chev{width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none}
.weekh[aria-expanded="true"] .chev{transform:rotate(45deg)}
.weekb{display:flex;flex-direction:column;margin-left:4px}
.day{width:100%;min-height:58px;padding:6px 8px 6px 14px;border:0;border-left:3px solid var(--line);border-radius:0;background:none;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left}
.day:hover{background:var(--chip)}
.day[aria-current="true"]{border-left-color:var(--accent);background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line)}
.day .t{display:block;line-height:1.2}
.day .t .num{font-size:22px}
.day .t .wd{margin-left:6px;font-size:13px;color:var(--muted)}
.day.rest .t .num{color:var(--muted)}
.day[aria-current="true"] .t .num{color:var(--accent-fg)}
.day .s{display:block;font-size:12px;color:var(--muted)}
.badge{font-size:12px;padding:1px 7px;border-radius:3px;background:var(--chip);white-space:nowrap}
.badge.done{background:var(--accent-bg);color:var(--accent-fg)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.main{flex:999 1 480px;min-width:0;background:var(--sheet);border:1px solid var(--line);border-radius:6px}
.mhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;padding:18px 24px 14px;border-bottom:1px solid var(--line2)}
.mhead h2{margin:0;font-size:32px;line-height:1}
.mhead h2 .wd{margin-left:8px;font:500 16px "Segoe UI","Malgun Gothic",sans-serif;color:var(--muted)}
.mbody{padding:6px 24px 28px}
.empty{padding:40px 16px;margin:18px 0;border:1px dashed var(--line);border-radius:6px;text-align:center;color:var(--muted)}
.rep{max-width:880px}
.rep h1{font-size:14px;font-weight:600;color:var(--muted);margin:14px 0 4px}
.rep h2{font-size:18px;margin:28px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.rep h3{font-size:16px;margin:26px 0 6px;color:var(--accent-fg)}
.rep p{margin:6px 0}
.rep ul{margin:6px 0;padding-left:1.3em}
.rep blockquote{margin:8px 0;padding:6px 12px;border-left:4px solid var(--warn);background:var(--warn-bg);color:var(--warn);border-radius:0 4px 4px 0}
.rep code{background:var(--chip);padding:1px 5px;border-radius:3px;font-size:.92em}
.tw{overflow-x:auto;margin:8px 0}
.rep table{border-collapse:collapse;width:100%;font-size:14px}
.rep th,.rep td{border:0;border-bottom:1px solid var(--line2);padding:6px 12px 6px 0;text-align:left;white-space:nowrap}
.rep td:first-child{color:var(--muted);width:9.5em}
.rep td:last-child{white-space:normal}
.rep th{font-weight:600;font-size:13px;color:var(--muted);border-bottom-color:var(--line)}
.zb{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--chip);margin:2px 0 6px;max-width:460px}
.zb i{display:block;min-width:0}
.zl{display:flex;flex-wrap:wrap;gap:2px 14px;font:500 13px var(--num)}
.zl span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--c)}
.nb{margin:12px 0 20px;padding:12px 16px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:4px;background:var(--field)}
.nbt{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--muted)}
.fr{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px 10px;margin-bottom:8px}
.fr label{flex:0 0 150px;font-size:13px;color:var(--muted);padding-top:8px}
.fr textarea{flex:1 1 240px;min-height:40px;resize:vertical;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--sheet);overflow:hidden}
.dwrap{display:flex;flex-wrap:wrap;min-height:320px}
.dlist{flex:0 0 260px;max-width:100%;padding:16px;border-right:1px solid var(--line2);display:flex;flex-direction:column;gap:18px}
.dview{flex:1 1 420px;min-width:0}
.dk{border:1px dashed transparent;border-radius:6px}
.dk:hover{border-color:var(--line)}
.dkh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.dkh h2{margin:0;font-size:13px;font-weight:600;color:var(--muted)}
.dit{width:100%;min-height:40px;padding:4px 8px 4px 12px;border:0;border-left:3px solid var(--line);border-radius:0;background:none;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;font-size:14px}
.dit:hover{background:var(--chip)}
.dit[aria-current="true"]{border-left-color:var(--accent);background:var(--field);color:var(--accent-fg);font-weight:600}
@media (max-width:900px){.dlist{flex:1 1 100%;border-right:0;border-bottom:1px solid var(--line2)}}
.fbai h3{margin:0;font-size:15px;color:var(--accent-fg)}
.fbai .fbh{margin:16px 0 6px}
.fb{margin-top:32px;padding-top:4px;border-top:1px solid var(--line)}
.fbh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 6px}
.fbh h2{border:0;margin:0;padding:0}
.fbe{width:100%;min-height:220px;resize:vertical;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--field);font:inherit;font-size:13px;line-height:1.5}
.fbb{background:var(--field);border:1px solid var(--line);border-radius:4px;padding:4px 16px 8px}
.fbb h2{font-size:15px;margin:14px 0 4px;padding:0;border:0}
.rep ol{margin:6px 0;padding-left:1.5em}
.rep hr{border:0;border-top:1px dashed var(--line);margin:16px 0}
.nbf{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.st{font-size:13px;color:var(--muted)}
.st.ok{color:var(--ok)}.st.err{color:var(--danger)}
.claude{flex:0 0 var(--cw,460px);min-width:0;padding:0 0 0 4px;display:flex;flex-direction:column;gap:12px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
.claude.wide{flex:1 1 480px}
.claude textarea,.claude select,#fbai{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--sheet)}
.claude textarea{min-height:150px;resize:vertical}
#fbai{width:auto}
.claude textarea#ais{min-height:90px;font-size:13px}
.split{flex:0 0 12px;margin:0 -10px;align-self:stretch;cursor:col-resize;position:relative;touch-action:none}
.split::after{content:"";position:absolute;left:5px;top:0;bottom:0;width:2px;border-radius:1px;background:var(--line)}
.split:hover::after,.split:focus-visible::after,.split.drag::after{background:var(--accent);width:3px;left:4.5px}
.chips{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.chip{min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:4px;background:var(--sheet);font-size:13px;text-align:left}
.chip:hover{border-color:var(--accent)}
.claude details{font-size:13px}
.claude pre{max-height:40vh;overflow:auto;white-space:pre-wrap;word-break:break-word;padding:8px;background:var(--field);border:1px solid var(--line2);border-radius:4px;font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.overlay{position:fixed;inset:0;background:rgba(14,18,20,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal{width:100%;max-width:520px;max-height:100%;overflow:auto;background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:16px}
.modal h2{margin:0;font-size:18px}
.modal .lab{font-size:13px;font-weight:600;color:var(--muted)}
.modal .fld{display:flex;flex-direction:column;gap:6px;flex:1 1 180px}
.modal>.fld{flex:none}
.modal input[type=text],.modal input[type=email],.modal input[type=date]{min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:4px;background:var(--sheet)}
.dz{display:flex;flex-direction:column;align-items:center;gap:10px;padding:32px 16px;border:2px dashed var(--line);border-radius:6px;background:var(--field);text-align:center}
.dz.over{border-color:var(--accent);background:var(--accent-bg)}
.log{max-height:200px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin:0;padding:8px 10px;border-radius:4px;background:var(--field);border:1px solid var(--line2);font-size:12px}
.res{display:flex;flex-direction:column;gap:6px;font-size:13px}
.res .r{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line2);border-radius:4px}
.modal.wide{max-width:760px}
.sets-t{width:100%;border-collapse:collapse;font-size:13px}
.sets-t th,.sets-t td{padding:5px 6px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
.sets-t th{font-size:12px;color:var(--muted);font-weight:600}
.sets-t select,.sets-t input{width:100%;min-height:34px;padding:0 6px;border:1px solid var(--line);border-radius:4px;background:var(--sheet);font:inherit}
.sets-t input[type=number]{width:72px}
.sets-t tr.drop td{opacity:.45;text-decoration:line-through}
.sets-t .was{display:block;font-size:11px;color:var(--muted);text-decoration:none}
.note{padding:10px 12px;border-radius:4px;background:var(--field);font-size:13px}
#drop{position:fixed;inset:0;background:rgba(27,111,191,.15);border:3px dashed var(--accent);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--accent);z-index:20}
#drop[hidden]{display:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:90vw;padding:10px 16px;border-radius:6px;background:#14191C;color:#fff;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (max-width:900px){.claude{flex:1 1 100%!important;position:static;max-height:none}.split{display:none!important}.top,.tabs{padding-left:16px;padding-right:16px}.cols{padding:16px}.mbody,.mhead{padding-left:16px;padding-right:16px}.side{max-width:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>훈련 리포트</h1><span class="sub">Garmin 일별 리포트 관리</span></div>
  <div class="actions">
    <button class="btn primary" data-act="open-garmin">가민에서 가져오기</button>
    <button class="btn" id="inbox-btn" data-act="apply-inbox" title="피드백 폴더에 넣어 둔 날짜_AI이름.md 파일을 반영합니다">피드백 반영</button>
    <button class="btn" data-act="open-upload">.md 파일 올리기</button>
    <button class="btn" data-act="open-account">계정 설정</button>
  </div>
</header>
<nav class="tabs" id="tabs" role="tablist" aria-label="보기 전환"></nav>
<div class="cols">
  <aside class="card side" id="side" aria-label="파일 목록"></aside>
  <main class="card main" id="main"></main>
  <section class="card main docs" id="docs" aria-label="문서" hidden></section>
  <div class="split" id="split" role="separator" aria-orientation="vertical" aria-label="AI 창 너비 조절 (좌우 방향키)" tabindex="0"></div>
  <aside class="card claude" id="claude" aria-label="AI에게 보내기"></aside>
</div>
<div id="modal-root"></div>
<div id="drop" hidden>.md 파일을 여기에 놓으세요</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const TABS=[["report","리포트"],["claude","AI"],["split","리포트 + AI"],["docs","문서"]];
const QUESTIONS=["이 날 회복 상태와 운동 강도를 평가해 줘","내일 운동 계획을 제안해 줘","메모에 적을 내용을 정리해 줘"];
const DEFAULT_AIS=[["Claude","https://claude.ai/new"],["ChatGPT","https://chatgpt.com/"],["Gemini","https://gemini.google.com/app"]];
const WD="월화수목금토일";
const S={fb:[],fbEdit:false,days:[],today:"",sel:null,md:"",tab:"split",dirty:new Set(),question:QUESTIONS[0],g:null,up:[],uploadFiles:new Map(),settings:null,
  claudeW:Math.max(320,+store("claudeW")||460),openWeeks:new Set([].concat(loadJson("weeks",[]))),revealed:null,ais:loadAis(),popup:store("popup")!=="0",ref:store("ref")==="1",hasRef:false,docs:{kinds:[],sel:null,text:"",edit:false,isNew:false,upKind:"plan"},asFile:store("asfile")!=="0",plan:store("plan")==="1",hasPlan:false,graph:store("graph")||"none",ser:[]};

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const fmtLocal=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDay=s=>new Date(s+"T00:00:00");
const addDays=(s,n)=>{const d=parseDay(s);d.setDate(d.getDate()+n);return fmtLocal(d)};
const wdOf=s=>WD[(parseDay(s).getDay()+6)%7];
const dayLabel=s=>`${s.slice(5)} (${wdOf(s)})`;
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function loadJson(k,d){try{const v=JSON.parse(store(k)||"null");return v===null?d:v}catch(e){return d}}
function loadAis(){const v=loadJson("ais",null);return Array.isArray(v)&&v.length&&v.every(x=>Array.isArray(x)&&typeof x[0]==="string"&&/^https:\/\//.test(x[1]))?v:DEFAULT_AIS.map(x=>[...x])}
let toastTimer;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),3200)}
async function api(path,body){
  const opt=body===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)};
  let res;try{res=await fetch(path,opt)}catch(e){throw {error:"서버에 연결할 수 없습니다. python app.py 가 실행 중인지 확인하세요"}}
  let data={};try{data=await res.json()}catch(e){}
  if(!res.ok)throw {status:res.status,...data,error:data.error||`오류 (${res.status})`};
  return data;
}
function copyText(text){
  if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(text);
  return new Promise((ok,no)=>{const t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();
    try{document.execCommand("copy")?ok():no()}catch(e){no(e)}t.remove()});
}

/* ---------- markdown (보기 전용, 표준 문법 일부) ---------- */
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  return s.replace(/(^|[\s(])_([^_]+)_(?=$|[\s).,])/g,"$1<em>$2</em>");
}
function zoneBar(v){
  const z=[...v.matchAll(/Z([1-5])\s+(\d+):(\d{2})(?::(\d{2}))?/g)].map(m=>{const a=m.slice(2).filter(x=>x!==undefined).map(Number);return {n:m[1],t:a.length===3?a[0]*3600+a[1]*60+a[2]:a[0]*60+a[1],txt:m[0]}});
  const tot=z.reduce((a,x)=>a+x.t,0);if(z.length<2||!tot)return "";
  return `<div class="zb" role="img" aria-label="${esc(v)}">${z.map(x=>`<i style="width:${(x.t/tot*100).toFixed(2)}%;background:var(--z${x.n})"></i>`).join("")}</div><div class="zl">${z.map(x=>`<span style="--c:var(--z${x.n})">${esc(x.txt)}</span>`).join("")}</div>`;
}
function mdTable(rows){
  const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
  const head=cells(rows[0]),body=rows.slice(2).map(cells);
  return `<div class="tw"><table><thead><tr>${head.map(h=>`<th>${inline(h)}</th>`).join("")}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${/존 시간/.test(r[0])&&zoneBar(c)||inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function renderMd(md){
  md=md.replace("**메모** (마커 안쪽에 쓰세요)","").replace(/<!--[\s\S]*?-->/g,"\n");
  const L=md.split("\n"),out=[];let i=0;
  const block=/^(#{1,3} |>|\||- |\d+\. |-{3,}\s*$)/;
  while(i<L.length){
    const l=L[i];let m;
    if(/^\s*$/.test(l)){i++;continue}
    if(m=l.match(/^(#{1,3}) (.*)$/)){out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`);i++;continue}
    if(l.startsWith(">")){const b=[];while(i<L.length&&L[i].startsWith(">")){b.push(L[i].replace(/^>\s?/,""));i++}out.push(`<blockquote>${inline(b.join(" "))}</blockquote>`);continue}
    if(l.startsWith("|")){const r=[];while(i<L.length&&L[i].startsWith("|")){r.push(L[i]);i++}out.push(mdTable(r));continue}
    if(/^-{3,}\s*$/.test(l)){out.push("<hr>");i++;continue}
    if(/^\d+\. /.test(l)){const b=[];while(i<L.length&&/^\d+\. /.test(L[i])){b.push(L[i].replace(/^\d+\. /,""));i++}out.push(`<ol>${b.map(x=>`<li>${inline(x)}</li>`).join("")}</ol>`);continue}
    if(l.startsWith("- ")){const b=[];while(i<L.length&&L[i].startsWith("- ")){b.push(L[i].slice(2));i++}
      const items=b.filter(x=>!/^[^:]+:\s*$/.test(x));  // 비어 있는 메모 칸은 숨김
      if(items.length)out.push(`<ul>${items.map(x=>`<li>${inline(x)}</li>`).join("")}</ul>`);continue}
    const b=[];while(i<L.length&&!/^\s*$/.test(L[i])&&!block.test(L[i])){b.push(L[i]);i++}
    out.push(`<p>${inline(b.join(" "))}</p>`);
  }
  return out.join("\n");
}

/* ---------- notes ---------- */
function exercisesIn(before){
  const k=before.indexOf("**웨이트 세트**");if(k<0)return [];
  const names=[];
  for(const line of before.slice(k).split("\n")){
    const m=line.match(/^\|\s*([^|]+?)\s*\|/);
    if(m&&!/^[-\s]+$/.test(m[1])&&m[1]!=="운동"&&!m[1].startsWith("**"))names.push(m[1]);
  }
  return [...new Set(names)];
}
function noteForm(id,body,before,i){
  const {fields,extra}=parseFields(body),ex=exercisesIn(before);
  return `<section class="nb" data-id="${esc(id)}" data-ex="${esc(JSON.stringify(ex))}"><div class="nbt">메모 (바로 편집 · 저장하면 .md에 반영)</div>`+
    fields.map((f,j)=>`<div class="fr"><label for="f${i}_${j}">${esc(f.label)}${S.rpeDoc&&/RPE/i.test(f.label)?`<br><button type="button" class="btn small" data-act="open-rpe" style="min-height:28px;padding:0 8px;margin-top:4px">기준표 보기</button>`:""}</label><textarea id="f${i}_${j}" rows="1" data-label="${esc(f.label)}">${esc(f.value)}</textarea></div>`).join("")+
    (extra?`<div class="fr"><label>기타</label><textarea data-extra rows="2">${esc(extra)}</textarea></div>`:"")+
    `<div class="nbf"><button class="btn primary small" data-act="save-note" disabled>저장</button>${ex.length?`<button class="btn small" data-act="open-ss">슈퍼세트 표시</button>`:""}${ex.length&&/^\d+$/.test(id)?`<button class="btn small" data-act="edit-sets">세트 수정</button>`:""}<span class="st"></span></div></section>`;
}
function renderReportWithNotes(md){
  const re=/<!-- notes:([\w-]+) -->\n?([\s\S]*?)<!-- \/notes -->/g;
  let last=0,m,html="",i=0;
  while((m=re.exec(md))){
    const before=md.slice(last,m.index);
    html+=renderMd(before)+noteForm(m[1],m[2],before,i++);
    last=re.lastIndex;
  }
  return html+renderMd(md.slice(last));
}
function parseFields(body){
  const fields=[],extra=[];
  for(const line of body.split("\n")){
    const m=line.match(/^- ([^:\n]+):\s?(.*)$/);
    if(m)fields.push({label:m[1],value:m[2]});else if(line.trim())extra.push(line);
  }
  return {fields,extra:extra.join("\n")};
}
function replaceNote(md,id,text){
  const re=new RegExp(`<!-- notes:${id.replace(/[^\w-]/g,"")} -->\\n?[\\s\\S]*?<!-- \\/notes -->`);
  return md.replace(re,()=>`<!-- notes:${id} -->\n${text}<!-- /notes -->`);
}

/* ---------- load ---------- */
async function loadDays(keepSel=true){
  const d=await api("/api/days");S.days=d.days;S.today=d.today;S.hasPlan=!!d.hasPlan;S.hasRef=!!d.hasRef;S.rpeDoc=d.rpeDoc||null;
  if(!keepSel||!S.days.some(x=>x.date===S.sel))S.sel=S.days.length?S.days[0].date:null;
}
async function loadReport(){
  S.fbEdit=false;S.fb=[];S.ser=[];
  if(!S.sel){S.md="";return}
  try{S.md=(await api("/api/report?date="+S.sel)).markdown}catch(e){S.md="";toast(e.error)}
  try{S.fb=(await api("/api/feedback?date="+S.sel)).items}catch(e){S.fb=[]}
  try{S.ser=(await api("/api/series?date="+S.sel)).activities}catch(e){S.ser=[]}
}
async function selectDay(day){
  if(day===S.sel)return;
  if(S.dirty.size&&!confirm("저장하지 않은 메모가 있습니다. 이동할까요?"))return;
  S.dirty.clear();S.sel=day;await loadReport();render();
}

/* ---------- render ---------- */
function render(){renderTabs();renderSide();renderMain();renderClaude();layout()}
function layout(){
  const t=S.tab;
  $("#main").hidden=t==="claude"||t==="docs";
  $("#side").hidden=t==="docs";
  $("#docs").hidden=t!=="docs";
  $("#claude").hidden=!(t==="claude"||t==="split");
  $("#claude").classList.toggle("wide",t==="claude");
  $("#claude").style.setProperty("--cw",S.claudeW+"px");
  $("#split").hidden=t!=="split";
}
function initSplit(){
  const sp=$("#split");
  const set=w=>{S.claudeW=Math.max(320,Math.min(Math.round(window.innerWidth*0.7),Math.round(w)));$("#claude").style.setProperty("--cw",S.claudeW+"px")};
  sp.addEventListener("pointerdown",e=>{sp.setPointerCapture(e.pointerId);sp.classList.add("drag")});
  sp.addEventListener("pointermove",e=>{if(sp.hasPointerCapture(e.pointerId))set($(".cols").getBoundingClientRect().right-16-e.clientX-6)});
  const end=e=>{sp.classList.remove("drag");store("claudeW",String(S.claudeW))};
  sp.addEventListener("pointerup",end);sp.addEventListener("pointercancel",end);
  sp.addEventListener("keydown",e=>{
    if(e.key==="ArrowLeft"||e.key==="ArrowRight"){e.preventDefault();set(S.claudeW+(e.key==="ArrowLeft"?32:-32));store("claudeW",String(S.claudeW))}
  });
}
async function refreshInbox(){
  try{S.inbox=await api("/api/inbox")}catch(e){S.inbox=null}
  const b=$("#inbox-btn");if(!b)return;
  const n=S.inbox?S.inbox.count:0;
  b.textContent=n?`피드백 반영 (${n})`:"피드백 반영";
  b.classList.toggle("primary",n>0);
}
function inboxResultModal(r){
  const lab={ok:"반영됨",dup:"이미 있음",skip:"건너뜀"},col={ok:"var(--ok)",dup:"var(--muted)",skip:"var(--danger)"};
  const rows=r.results.length?r.results.map(x=>`<div class="r"><strong style="color:${col[x.state]}">${lab[x.state]}</strong><span>${esc(x.name)}</span>${x.error?`<span class="muted">${esc(x.error)}</span>`:`<span class="muted">→ ${esc(x.date)} [${esc(x.ai)}]</span>`}</div>`).join(""):`<div class="note">반영할 파일이 없습니다. 파일 이름이 <code>2026-11-08_gpt.md</code> 형식인지 확인하세요.</div>`;
  openModal(`<h2>피드백 반영 결과</h2><div class="res">${rows}</div><div class="muted" style="font-size:12px">폴더: ${esc(r.path)}${r.ignored?` · 이름 형식이 달라 건드리지 않은 .md ${r.ignored}개`:""}<br>반영한 파일은 폴더 안 <code>_반영됨</code>으로 옮겼습니다.</div><div class="row" style="justify-content:flex-end"><button class="btn primary" data-act="close">닫기</button></div>`);
}
/* ---------- 문서(훈련 계획 / 사전) ---------- */
async function showDocs(){
  try{S.docs.kinds=(await api("/api/docs")).kinds}catch(e){toast(e.error)}
  renderDocs();

async function openDoc(kind,name){

const mmss=v=>{v=Math.round(v);return Math.floor(v/60)+":"+String(v%60).padStart(2,"0")};
function lineSvg(a,key,label,color,inv,fmt){
  const W=720,H=130,L=44,R=10,T=8,B=20,t=a.series.t,y=a.series[key];
  const pts=t.map((x,i)=>[x,y[i]]).filter(p=>p[1]!=null);
  if(pts.length<2)return"";
  let vs=pts.map(p=>p[1]).sort((m,n)=>m-n);
  let lo=vs[Math.floor(vs.length*0.01)],hi=vs[Math.ceil(vs.length*0.99)-1];
  if(key==="hr"){lo=Math.min(lo,vs[0]);hi=Math.max(hi,vs[vs.length-1])}
  const pad=(hi-lo)*0.1||5;lo-=pad;hi+=pad;
  const tm=t[t.length-1]||1;
  const X=x=>L+(x/tm)*(W-L-R),Y=v=>{const f=(Math.min(hi,Math.max(lo,v))-lo)/(hi-lo);return T+(inv?f:1-f)*(H-T-B)};
  const d=pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join("");
  const ticks=[0,1,2,3].map(i=>lo+(hi-lo)*i/3);
  const grid=ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt(v)}</text>`).join("");
  const step=tm>1800?600:tm>600?300:120;let xt="";for(let x=0;x<=tm;x+=step)xt+=`<text x="${X(x).toFixed(1)}" y="${H-5}" text-anchor="middle" font-size="10" fill="var(--muted)">${Math.round(x/60)}분</text>`;
  const jm=key==="hr"?a.jumps.map(j=>`<line x1="${X(j.t).toFixed(1)}" x2="${X(j.t).toFixed(1)}" y1="${T}" y2="${H-B}" stroke="var(--z5)" stroke-dasharray="3 3"/>`).join(""):"";
  return `<div class="muted" style="font-size:12px;margin-top:6px">${label}</div><svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto" role="img" aria-label="${label}">${grid}${xt}${jm}<path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
function graphBlock(){
  if(!S.ser.length)return "";
  return `<section class="fb"><div class="fbh"><h2>심박·페이스</h2></div>`+S.ser.map(a=>{
    const jt=a.jumps.length?`<div style="font-size:12px;line-height:1.6;color:var(--z5)">심박 급변: ${a.jumps.map(j=>`${mmss(j.t)} ${j.from}→${j.to}bpm (페이스 ${j.pace?mmss(j.pace)+"/km":"-"}, 케이던스 ${j.cad||"-"})${j.lock?" ※케이던스 락 의심":""}`).join(" · ")}</div>`:"";
    return `<h3 style="margin:10px 0 0">${esc(a.name)}</h3>${jt}${lineSvg(a,"hr","심박 (bpm)","var(--z5)",false,v=>Math.round(v))}${lineSvg(a,"pace","페이스 (/km, 위쪽이 빠름)","var(--z2)",true,mmss)}${lineSvg(a,"cad","케이던스 (spm)","var(--z3)",false,v=>Math.round(v))}`;
  }).join("")+`</section>`;

async function sendFile(file,overwrite,idx){

async function postUpload(name,content,overwrite){
  try{
    const r=await api("/api/upload",{name,content,overwrite});
    if(r.ok)return {name,state:"ok",date:r.date,backup:r.backup};
    return {name,state:"exists",date:r.date,mtime:r.mtime};
  }catch(e){return {name,state:"err",error:e.error}}

async function handleFiles(files){
  files=[...files];if(!files.length)return;
  if(!$("#modal-root .modal #dz")){S.up=[];openModal(uploadModal())}
  for(const f of files){
    if(!/\.md$/i.test(f.name)){S.up.push({name:f.name,state:"err",error:".md 파일만 올릴 수 있습니다"});continue}
    let txt="";try{txt=await f.text()}catch(e){S.up.push({name:f.name,state:"err",error:"파일을 읽지 못했습니다"});continue}
    const first=(txt.split(/\r?\n/).find(x=>x.trim())||"");
    if(/^#\s.*훈련 리포트/.test(first)){S.up.push(await sendFile(f,false));continue}
    S.up.push(await addFeedbackFile(f.name,txt));
  }
  refreshUpload();
  await afterUpload();
}
const AI_ALIAS={gpt:"ChatGPT",chatgpt:"ChatGPT",openai:"ChatGPT",gemini:"gemini",claude:"claude",claud:"claude",cladue:"claude",perplexity:"Perplexity",grok:"Grok",copilot:"Copilot"};
function aiFromName(name){
  const m=name.match(/\d{4}-\d{2}-\d{2}[_\-\s]+(.+?)\.md$/i);if(!m)return "";
  const k=m[1].trim();return AI_ALIAS[k.toLowerCase().replace(/[\s_.\-]+/g,"")]||k;
}
async function addFeedbackFile(name,txt){
  const m=name.match(/(\d{4}-\d{2}-\d{2})/);const day=m?m[1]:S.sel;
  const ai=aiFromName(name);
  if(!ai)return {name,state:"err",error:"파일 이름에 AI 이름이 없습니다. 2026-11-05_gpt.md 처럼 날짜_AI이름.md 로 바꿔 주세요"};
  if(!day)return {name,state:"err",error:"피드백을 붙일 날짜를 알 수 없습니다. 날짜를 고르거나 파일 이름에 2026-11-05 형식을 넣으세요"};
  if(!S.days.some(d=>d.date===day))return {name,state:"err",error:`${day} 리포트가 없습니다. 리포트를 먼저 가져오세요`};
  try{const r=await api("/api/feedback",{date:day,ai,text:txt,mode:"append"});return {name,state:"ok",date:day,fb:true,dup:!!r.duplicate,ai}}
  catch(e){return {name,state:"err",error:e.error}}
}
async function afterUpload(){

}

document.addEventListener("click",async ev=>{

  if(!t)return;

  if(t.dataset.ai!==undefined)return openAi(+t.dataset.ai);
  if(t.dataset.day)return selectDay(t.dataset.day);

  if(t.dataset.preset){const [a,b]=t.dataset.preset.split("|");S.g.start=a;S.g.end=b;refreshGarmin();return}

      }catch(e){toast(e.error)}

    }

    case"doc-new":{
      const kind=t.dataset.kind;
      openModal(`<h2>새 문서</h2><div class="fld"><label for="nd-name" class="lab">파일 이름 (.md 는 자동으로 붙습니다)</label><input id="nd-name" type="text" autocomplete="off" placeholder="${kind==="plan"?"훈련 방향":"RPE 기준표"}"></div><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">취소</button><button class="btn primary" data-act="doc-create" data-kind="${kind}">만들기</button></div>`);

    case"doc-create":{
      let n=$("#nd-name").value.trim();if(!n){toast("이름을 입력하세요");return}
      if(!/\.md$/i.test(n))n+=".md";
      const kind=t.dataset.kind,ex=((S.docs.kinds.find(k=>k.kind===kind)||{items:[]}).items).some(i=>i.name===n);
      closeModal();
      if(ex)return openDoc(kind,n);
      Object.assign(S.docs,{sel:{kind,name:n},text:`# ${n.replace(/\.md$/i,"")}\n\n`,edit:true,isNew:true});renderDocs();$("#doc-text")&&$("#doc-text").focus();return;
    }
    case"doc-save":{
      const {kind,name}=S.docs.sel;t.disabled=true;
      try{const r=await api("/api/doc",{kind,name,text:$("#doc-text").value});S.docs.text=$("#doc-text").value;S.docs.edit=false;S.docs.isNew=false;await showDocs();await loadDays();renderClaude();toast(r.unchanged?"바뀐 내용이 없습니다":"저장했습니다")}
      catch(e){toast(e.error);t.disabled=false}
      return;
    }
    case"doc-delete":{
      const {kind,name}=S.docs.sel;if(!confirm(`'${name}' 을(를) 삭제할까요? (파일은 _삭제 폴더로 옮겨집니다)`))return;
      try{await api("/api/doc/delete",{kind,name});S.docs.sel=null;await showDocs();await loadDays();renderClaude();toast("삭제했습니다")}catch(e){toast(e.error)}
      return;
    }
    case"open-upload":return openUpload();
    case"open-account":return accountModal();
    case"apply-inbox":{
      t.disabled=true;
      try{
        const r=await api("/api/inbox/apply",{});
        await loadDays();
        if(r.dates.includes(S.sel)&&!S.dirty.size)await loadReport();
        render();inboxResultModal(r);
      }catch(e){
        toast(e.code==="no_inbox"?`${e.error} — 폴더를 만들거나 계정 설정에서 경로를 지정하세요`:e.error);
      }finally{t.disabled=false;refreshInbox()}
      return;
    }
    case"close":return closeModal();
    case"run-garmin":return runGarmin();
    case"pick-files":return $("#fi").click();
    case"open-ss":{const sec=t.closest(".nb");S.ssId=sec.dataset.id;let ex=[];try{ex=JSON.parse(sec.dataset.ex||"[]")}catch(e){}openModal(ssModal(ex));return}
    case"ss-apply":{
      const txt=ssText();if(!txt){toast("종목 A와 B를 입력하세요");return}
      const sec=document.querySelector(`.nb[data-id="${S.ssId}"]`),ta=sec&&sec.querySelector('textarea[data-label="비고"]');
      if(!ta){toast("이 메모에는 비고 칸이 없습니다");return}
      const cur=ta.value.trim();ta.value=cur?cur+" / "+txt:txt;autosize(ta);
      ta.dispatchEvent(new Event("input",{bubbles:true}));closeModal();toast("비고에 추가했습니다. 저장을 눌러 주세요");return;
    }
    case"save-ais":{
      const list=[];
      for(const l of $("#ais").value.split("\n").map(s=>s.trim()).filter(Boolean)){
        const [n,u]=l.split("|").map(s=>s.trim());
        if(!n||!/^https:\/\/\S+$/.test(u||"")){toast(`형식 오류: ${l}  (이름 | https://주소)`);return}
        list.push([n,u]);
      }
      if(!list.length){toast("AI를 한 개 이상 넣어 주세요");return}
      S.ais=list;store("ais",JSON.stringify(list));renderClaude();toast("AI 목록을 저장했습니다");return;
    }
    case"copy-prompt":
      try{await copyText(await promptText());toast("복사했습니다. AI 창에 붙여넣으세요")}catch(e){toast("복사하지 못했습니다. 미리보기에서 직접 선택해 복사하세요")}
      return;
    case"rebuild":
      t.disabled=true;
      try{await api("/api/report/rebuild",{date:S.sel});await loadDays();await loadReport();render();toast("가민 원본으로 리포트를 다시 만들었습니다 (메모는 유지)")}
      catch(e){toast(e.error);t.disabled=false}
      return;
    case"edit-sets":return openSets(t.closest(".nb").dataset.id);
    case"save-sets":return saveSets(t);
    case"sets-reset":{
      S.sets.sets=S.sets.sets.map(r=>({...r,fix:null}));
      $("#sets-tb").innerHTML=S.sets.sets.map(setsRow).join("");return;
    }
    case"save-note":{
      const sec=t.closest(".nb"),id=sec.dataset.id,st=sec.querySelector(".st");
      const lines=[...sec.querySelectorAll("textarea[data-label]")].map(x=>{const v=x.value.replace(/\s*\n\s*/g," ").trim();return `- ${x.dataset.label}:${v?" "+v:""}`});
      const ex=sec.querySelector("textarea[data-extra]");if(ex&&ex.value.trim())lines.push(...ex.value.replace(/\r/g,"").split("\n"));
      const text=lines.join("\n")+"\n";
      t.disabled=true;st.className="st";st.textContent="저장 중…";
      try{
        await api("/api/notes",{date:S.sel,id,text});
        S.md=replaceNote(S.md,id,text);S.dirty.delete(id);
        st.className="st ok";st.textContent="저장했습니다";
        loadDays().then(renderSide);
      }catch(e){st.className="st err";st.textContent=e.error;t.disabled=false}
      return;
    }
    case"fb-addform":S.fbEdit="add";renderMain();$("#fbt")&&$("#fbt").focus();return;
    case"fb-add":{
      const v=$("#fbt").value;if(!v.trim()){toast("붙여넣은 내용이 없습니다");return}
      t.disabled=true;
      try{const r=await api("/api/feedback",{date:S.sel,ai:$("#fbai").value||"기타",text:v,mode:"append"});S.fb=r.items;S.fbEdit=false;await loadDays();render();toast(r.duplicate?"이미 있는 피드백입니다":"피드백을 추가했습니다")}
      catch(e){toast(e.error);t.disabled=false}
      return;
    }
    case"fb-edit":S.fbEdit="edit:"+t.dataset.fbai;renderMain();$("#fbt")&&$("#fbt").focus();return;
    case"fb-cancel":S.fbEdit=false;renderMain();return;
    case"fb-save":{
      const ai=String(S.fbEdit).slice(5);t.disabled=true;
      try{const r=await api("/api/feedback",{date:S.sel,ai,text:$("#fbt").value,mode:"set"});S.fb=r.items;S.fbEdit=false;await loadDays();render();toast("저장했습니다")}
      catch(e){toast(e.error);t.disabled=false}
      return;
    }
    case"save-account":{
      try{
        const r=await api("/api/settings",{email:$("#ae").value.trim()||undefined,inbox:$("#ai-inbox").value,root:$("#ai-root").value});S.settings=r;
        toast(r.copied&&r.copied.length?`저장했습니다. 동기화 폴더로 복사: ${r.copied.join(", ")}`:"저장했습니다");closeModal();refreshInbox();
        if(r.copied)await loadDays(true).then(()=>loadReport()).then(render)
      }catch(e){toast(e.error)}
      return;
    }
    case"db-sync":{
      t.disabled=true;
      try{const r=await api("/api/db/sync",{});toast(`DB에 반영했습니다 (${r.result.days||0}일, 활동 ${r.result.activities||0}건)`)}catch(e){toast(e.error)}
      t.disabled=false;return;
    }
    case"snapshot":{
      t.disabled=true;
      try{const r=await api("/api/snapshot",{});toast(`스냅샷을 만들었습니다 (${r.files}개 파일): ${r.path}`)}catch(e){toast(e.error)}
      t.disabled=false;return;
    }
  }
});
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id&&t.id.startsWith("ss")&&$("#ssPrev")){$("#ssPrev").textContent=ssText()||"SS: (종목 A, B를 입력하세요)";return}
  if(t.id==="q"){S.question=t.value;const d=$("#claude details");if(d){const p=d.querySelector("pre");if(p){p.textContent=buildPrompt();d.querySelector("summary").textContent=`보낼 내용 미리보기 (${buildPrompt().length.toLocaleString()}자)`}}return}
  if(t.closest(".nb")&&t.matches("textarea")){
    autosize(t);const sec=t.closest(".nb");S.dirty.add(sec.dataset.id);
    const b=sec.querySelector('[data-act="save-note"]');b.disabled=false;
    const st=sec.querySelector(".st");st.className="st";st.textContent="저장 안 됨";
  }
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="g1"&&S.g){S.g.start=t.value;refreshGarmin()}
  else if(t.id==="g2"&&S.g){S.g.end=t.value;refreshGarmin()}
  else if(t.id==="g3"&&S.g){S.g.redo=t.checked}
  else if(t.id==="fi"){handleFiles(t.files);t.value=""}
  else if(t.id==="asfile"){S.asFile=t.checked;store("asfile",t.checked?"1":"0");renderClaude()}
  else if(t.id==="plan"){S.plan=t.checked;store("plan",t.checked?"1":"0")}
  else if(t.matches("[data-drop]")){t.closest("tr").classList.toggle("drop",t.checked)}
  else if(t.matches("[data-exsel]")){
    const inp=t.closest("tr").querySelector("[data-exlabel]");
    inp.style.display=t.value==="__custom"?"":"none";if(t.value==="__custom")inp.focus();
  }
  else if(t.id==="graph"){S.graph=t.value;store("graph",t.value)}
  else if(t.id==="ref"){S.ref=t.checked;store("ref",t.checked?"1":"0")}
  else if(t.id==="doc-fi"){docUpload(S.docs.upKind,t.files);t.value=""}
  else if(t.id==="popup"){S.popup=t.checked;store("popup",t.checked?"1":"0")}
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&!(S.g&&S.g.running))closeModal()});
window.addEventListener("unhandledrejection",ev=>{const r=ev.reason;toast("오류: "+((r&&(r.error||r.message))||"알 수 없는 오류"))});
window.addEventListener("beforeunload",ev=>{if(S.dirty.size){ev.preventDefault();ev.returnValue=""}});

/* 파일 드래그 앤 드롭: 화면 어디에 놓아도 된다 */
let dragDepth=0;
const hasFiles=ev=>ev.dataTransfer&&[...(ev.dataTransfer.types||[])].includes("Files");
window.addEventListener("dragenter",ev=>{if(hasFiles(ev)){dragDepth++;if(S.tab!=="docs")$("#drop").hidden=false}});
window.addEventListener("dragleave",ev=>{if(hasFiles(ev)){dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)$("#drop").hidden=true}});
window.addEventListener("dragover",ev=>{if(hasFiles(ev))ev.preventDefault()});
window.addEventListener("drop",ev=>{
  if(!hasFiles(ev))return;ev.preventDefault();dragDepth=0;$("#drop").hidden=true;
  const dk=S.tab==="docs"&&ev.target.closest&&ev.target.closest("[data-kind-drop]");
  if(dk)docUpload(dk.dataset.kindDrop,ev.dataTransfer.files);else handleFiles(ev.dataTransfer.files);
});

/* ---------- start ---------- */
(async()=>{
  initSplit();
  const saved=store("tab");if(TABS.some(t=>t[0]===saved))S.tab=saved;
  try{await loadDays(false);await loadReport()}catch(e){toast(e.error)}
  render();refreshInbox();
  window.addEventListener("focus",refreshInbox);
})();
</script>
</body>
</html>
